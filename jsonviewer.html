<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>JSON 可视化</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="jsonviewer.css" />
  </head>
  <body>
    <div class="viewer-shell">
      <header class="toolbar" aria-label="JSON 工具栏">
        <h1><span class="brand-braces" aria-hidden="true">{ }</span>JSON 可视化</h1>
        <div class="toolbar-actions">
          <button id="pasteButton" type="button" title="从剪贴板粘贴到光标处">粘贴</button>
          <button id="validateButton" type="button">校验</button>
          <button class="primary" id="visualizeButton" type="button" title="四空格格式化 · Ctrl+Enter">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 3-1.3 4-4 1.3 4 1.4 1.3 4 1.4-4 4-1.4-4-1.3L12 3ZM4 12v5m-2.5-2.5h5" /></svg>
            可视化
          </button>
          <button id="compressButton" type="button">压缩</button>
          <button id="copyButton" type="button" title="复制完整 JSON，包含折叠内容" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M4 13H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v1"/></svg>
            <span>复制</span>
          </button>
          <span class="toolbar-separator" aria-hidden="true"></span>
          <button id="expandButton" type="button" title="展开所有对象和数组">全部展开</button>
          <button id="expandNextButton" type="button" title="从文档顶部逐个展开收起节点，并定位到所在行" disabled>逐个展开</button>
          <button id="collapseButton" type="button" title="收起所有非空对象和数组">全部收起</button>
          <button class="clear-button" id="clearButton" type="button">清空</button>
        </div>
        <div class="toolbar-info">
          <button class="validation-status" id="validationStatus" type="button" data-tone="idle" disabled>
            <span class="status-dot" aria-hidden="true"></span>
            <span id="statusText" role="status" aria-live="polite">等待输入</span>
          </button>
          <div class="document-stats" id="documentStats" aria-label="文档统计">
            <span id="textStats">1 行 · 0 字符</span>
            <span id="fileSize" title="0 字节（UTF-8，包含空白与折叠内容）">大小 0 B</span>
            <span id="jsonDepth" title="根容器深度为 1，嵌套容器逐层加 1；顶层基本类型为 0">深度 —</span>
          </div>
        </div>
      </header>
      <main id="editor" aria-label="JSON 编辑区"></main>
    </div>
    <div class="image-preview" id="imagePreview" hidden aria-hidden="true"></div>
    <div class="timestamp-preview" id="timestampPreview" hidden role="tooltip"></div>
    <script src="jsonviewer.js"></script>
  </body>
</html>
